name: Release AddOn

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # First job: Update changelog
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog from commits
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
            # First release - get all commits
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          else
            # Get commits since previous tag
            COMMITS=$(git log ${{ steps.prev_tag.outputs.prev_tag }}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          
          # Filter out commits that shouldn't be in changelog
          # Remove merge commits, WIP commits, and formatting commits
          FILTERED=$(echo "$COMMITS" | grep -v -E "^- (Merge|WIP|merge|Update|Initial plan|Fix typo)" || true)
          
          # If no commits after filtering, use all commits
          if [ -z "$FILTERED" ]; then
            FILTERED="$COMMITS"
          fi
          
          # Save to file for processing
          echo "$FILTERED" > /tmp/changelog_entries.txt
          
          echo "Generated changelog entries:"
          cat /tmp/changelog_entries.txt

      - name: Update Changelog.lua
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Read changelog entries
          CHANGES=$(cat /tmp/changelog_entries.txt)
          
          # Create Lua table entries
          LUA_CHANGES=""
          while IFS= read -r line; do
            # Remove leading "- " and escape quotes
            ENTRY=$(echo "$line" | sed 's/^- //' | sed 's/"/\\"/g')
            if [ -n "$ENTRY" ]; then
              LUA_CHANGES="${LUA_CHANGES}            \"${ENTRY}\",\n"
            fi
          done < /tmp/changelog_entries.txt
          
          # Remove trailing comma and newline
          LUA_CHANGES=$(echo -e "$LUA_CHANGES" | sed '$ s/,$//')
          
          # Create new version entry
          NEW_ENTRY="    {\n        version = \"${VERSION}\",\n        changes = {\n${LUA_CHANGES}\n        }\n    },"
          
          # Check if Changelog.lua exists
          if [ ! -f "Changelog.lua" ]; then
            echo "Error: Changelog.lua not found!"
            exit 1
          fi
          
          # Find the CHANGELOG_DATA section and insert new entry
          # We'll use awk to insert after the "local CHANGELOG_DATA = {" line
          awk -v new_entry="$NEW_ENTRY" '
            /^local CHANGELOG_DATA = \{/ {
              print $0
              print new_entry
              next
            }
            { print }
          ' Changelog.lua > Changelog.lua.tmp
          
          mv Changelog.lua.tmp Changelog.lua
          
          echo "Updated Changelog.lua with version $VERSION"

      - name: Check if changes were made
        id: check_changes
        run: |
          if git diff --quiet Changelog.lua; then
            echo "No changes to Changelog.lua"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in Changelog.lua"
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff Changelog.lua
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Changelog.lua
          git commit -m "Update changelog for version ${{ steps.version.outputs.version }}"
          
          # Push to the branch, not the tag
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH_NAME" = "HEAD" ]; then
            # Detached HEAD state, push to main/master
            git push origin HEAD:refs/heads/main || git push origin HEAD:refs/heads/master
          else
            git push origin HEAD:$BRANCH_NAME
          fi
          
          # Update the tag to point to new commit
          git tag -f ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }} --force

      - name: Summary
        run: |
          echo "### Changelog Update Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changelog entries added:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/changelog_entries.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Second job: Package and release (depends on changelog update)
  release:
    needs: update-changelog
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reads history for commit changelog
          ref: ${{ github.ref }}

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        with:
            args: -n "{package-name}-{project-version}:{project-version}"
